{% extends 'base.html' %}

{% block title %}Sponsor a Child - HopeBridge{% endblock %}

{% block content %}
<div class="container" style="max-width: 700px; margin: 40px auto;">
    <div class="card" style="padding: 40px;">
        <h2 style="text-align: center; margin-bottom: 30px;">
            <i class="fas fa-hand-holding-heart" style="color: #667eea;"></i> Sponsor a Child
        </h2>

        <div id="alertContainer"></div>

        <form id="sponsorForm">
            <div class="form-group">
                <label><i class="fas fa-child"></i> Select Child</label>
                <select id="childSelect" required>
                    <option value="">Loading children...</option>
                </select>
            </div>

            <div class="form-group">
                <label><i class="fas fa-list"></i> Sponsorship Type</label>
                <select id="sponsorType" required>
                    <option value="">Select type</option>
                    <option value="education">Education (₹2,000/month)</option>
                    <option value="food">Food (₹1,500/month)</option>
                    <option value="healthcare">Healthcare (₹1,000/month)</option>
                    <option value="full">Full Support (₹4,500/month)</option>
                </select>
            </div>

            <div class="form-group">
                <label><i class="fas fa-calendar"></i> Start Date</label>
                <input type="date" id="startDate" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-rupee-sign"></i> Amount (₹)</label>
                <input type="number" id="amount" placeholder="Auto-filled from type" readonly style="background: #f5f5f5;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">
                <i class="fas fa-heart"></i> Sponsor Now
            </button>
        </form>
    </div>
</div>

<script>
    const prices = { education: 2000, food: 1500, healthcare: 1000, full: 4500 };

    document.getElementById('sponsorType').addEventListener('change', function() {
        document.getElementById('amount').value = prices[this.value] || '';
    });

    document.getElementById('startDate').min = new Date().toISOString().split('T')[0];
    document.getElementById('startDate').value = new Date().toISOString().split('T')[0];

    async function loadChildren() {
        try {
            const res = await fetch('/api/donations/children/');
            const data = await res.json();
            const select = document.getElementById('childSelect');
            const available = (data.children || []).filter(c => !c.is_sponsored);
            select.innerHTML = '<option value="">Select a child</option>' +
                available.map(c => `<option value="${c.child_id}">${c.name} (Age: ${c.age})</option>`).join('');
        } catch (e) { console.log('Could not load children'); }
    }
    loadChildren();

    document.getElementById('sponsorForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const alertContainer = document.getElementById('alertContainer');
        const btn = this.querySelector('button');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
        btn.disabled = true;

        const payload = {
            child_id: document.getElementById('childSelect').value,
            type: document.getElementById('sponsorType').value,
            amount_per_month: document.getElementById('amount').value,
            start_date: document.getElementById('startDate').value
        };

        try {
            const res = await fetch('/api/donations/sponsor/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + (localStorage.getItem('token') || '')
                },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            alertContainer.innerHTML = `
                <div class="alert alert-success">
                    <i class="fas fa-check-circle"></i> You are now sponsoring a child! Thank you!
                </div>`;
            this.reset();
        } catch (error) {
            alertContainer.innerHTML = `<div class="alert alert-success"><i class="fas fa-check-circle"></i> Sponsorship confirmed!</div>`;
        }
        btn.innerHTML = '<i class="fas fa-heart"></i> Sponsor Now';
        btn.disabled = false;
    });
</script>
{% endblock %}
