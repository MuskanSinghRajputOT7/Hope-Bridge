{% extends 'base.html' %}

{% block title %}Dashboard - HopeBridge{% endblock %}

{% block content %}
<div class="container" style="margin-top: 30px;">
    <h2><i class="fas fa-chart-pie" style="color: #667eea;"></i> Dashboard</h2>
    <p style="color: #777; margin-bottom: 30px;">Welcome back, <strong id="userName">User</strong>!</p>

    <div class="grid">
        <div class="stat-card">
            <h3 id="totalNgos">0</h3>
            <p>Total NGOs</p>
        </div>
        <div class="stat-card">
            <h3 id="totalChildren">0</h3>
            <p>Children Supported</p>
        </div>
        <div class="stat-card">
            <h3 id="totalDonations">₹0</h3>
            <p>Total Donations</p>
        </div>
        <div class="stat-card">
            <h3 id="totalSponsorships">0</h3>
            <p>Active Sponsorships</p>
        </div>
    </div>

    <div id="dashboardContent"></div>

    <div class="card">
        <h3><i class="fas fa-bolt" style="color: #667eea;"></i> Quick Actions</h3>
        <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 15px;">
            <a href="/children/" class="btn btn-primary"><i class="fas fa-child"></i> View Children</a>
            <a href="/ngos/" class="btn btn-outline"><i class="fas fa-building"></i> View NGOs</a>
            <a href="/profile/" class="btn btn-outline"><i class="fas fa-user-edit"></i> Edit Profile</a>
        </div>
    </div>
</div>

<script>
    // ✅ AUTHENTICATION CHECK
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user) {
        // Not logged in → redirect to login
        window.location.href = '/login/';
    } else {
        // Logged in → show dashboard
        document.getElementById('userName').textContent = user.name || 'User';

        // Role-specific dashboard content
        const dashboardContent = document.getElementById('dashboardContent');
        const role = user.role;

        if (role === 'donor') {
            dashboardContent.innerHTML = `
                <div class="card">
                    <h3>💝 Donor Dashboard</h3>
                    <p>Welcome! You can sponsor children and make donations.</p>
                    <a href="/children/" class="btn btn-primary" style="margin-top: 10px;">Sponsor a Child</a>
                </div>
            `;
        } else if (role === 'ngo_staff') {
            dashboardContent.innerHTML = `
                <div class="card">
                    <h3>🏢 NGO Dashboard</h3>
                    <p>Manage your NGO, children, and donations.</p>
                    <a href="/admin/" class="btn btn-primary" style="margin-top: 10px;">Manage NGO</a>
                </div>
            `;
        } else if (role === 'volunteer') {
            dashboardContent.innerHTML = `
                <div class="card">
                    <h3>🤝 Volunteer Dashboard</h3>
                    <p>Schedule visits and help children.</p>
                    <a href="/visits/" class="btn btn-primary" style="margin-top: 10px;">Book a Visit</a>
                </div>
            `;
        } else if (role === 'adoptive_parent') {
            dashboardContent.innerHTML = `
                <div class="card">
                    <h3>👨‍👩‍👧 Adoption Dashboard</h3>
                    <p>View available children and apply for adoption.</p>
                    <a href="/children/" class="btn btn-primary" style="margin-top: 10px;">View Children</a>
                </div>
            `;
        } else if (role === 'admin') {
            dashboardContent.innerHTML = `
                <div class="card">
                    <h3>🔐 Admin Dashboard</h3>
                    <p>Manage the entire platform.</p>
                    <a href="/admin/" class="btn btn-primary" style="margin-top: 10px;">Go to Admin Panel</a>
                </div>
            `;
        }
    }

    // Fetch stats
    async function fetchStats() {
        try {
            const res = await fetch('/api/auth/ngo/list/');
            const data = await res.json();
            document.getElementById('totalNgos').textContent = data.count || 0;
        } catch (e) {
            console.log('Stats not available');
        }
    }
    fetchStats();
</script>
{% endblock %}
