{% extends 'base.html' %}

{% block title %}Visit Requests - HopeBridge{% endblock %}

{% block content %}
<div class="container" style="margin-top: 30px;">
    <h2><i class="fas fa-calendar-check" style="color: #667eea;"></i> Visit Requests</h2>
    <p style="color: #777; margin-bottom: 20px;">Approve or reject visit requests from donors and adoptive parents.</p>

    <div id="visitsContainer">
        <p>Loading visit requests...</p>
    </div>
</div>

<script>
    async function loadVisits() {
        try {
            const res = await fetch('/api/adoptions/visits/all/');
            const data = await res.json();
            const container = document.getElementById('visitsContainer');

            if (data.visits && data.visits.length > 0) {
                container.innerHTML = data.visits.map(v => `
                    <div class="card" style="margin: 15px 0;">
                        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
                            <div>
                                <h3>${v.visitor_name}</h3>
                                <p><i class="fas fa-envelope"></i> ${v.visitor_email}</p>
                                <p><i class="fas fa-phone"></i> ${v.visitor_phone}</p>
                                <p><i class="fas fa-calendar"></i> ${v.visit_date} at ${v.visit_time}</p>
                                <p><i class="fas fa-info-circle"></i> Purpose: ${v.purpose}</p>
                                <p><i class="fas fa-child"></i> Child: ${v.child_name || 'General'}</p>
                                <p style="color: ${v.status === 'pending' ? '#ffc107' : v.status === 'approved' ? '#28a745' : '#dc3545'};">
                                    <strong>Status: ${v.status.toUpperCase()}</strong>
                                </p>
                            </div>
                            <div style="display: flex; gap: 10px;">
                                ${v.status === 'pending' ? `
                                    <button class="btn btn-primary" onclick="approveVisit(${v.visit_id})">Approve</button>
                                    <button class="btn btn-outline" onclick="rejectVisit(${v.visit_id})">Reject</button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `).join('');
            } else {
                container.innerHTML = `<div class="alert alert-info"><i class="fas fa-info-circle"></i> No visit requests yet.</div>`;
            }
        } catch (e) {
            document.getElementById('visitsContainer').innerHTML = `<div class="alert alert-info"><i class="fas fa-info-circle"></i> No visit requests yet.</div>`;
        }
    }

    async function approveVisit(id) {
        if (!confirm('Approve this visit?')) return;
        await fetch(`/api/adoptions/visit/approve/${id}/`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'approved' })
        });
        loadVisits();
    }

    async function rejectVisit(id) {
        if (!confirm('Reject this visit?')) return;
        await fetch(`/api/adoptions/visit/approve/${id}/`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'rejected' })
        });
        loadVisits();
    }

    loadVisits();
</script>
{% endblock %}
