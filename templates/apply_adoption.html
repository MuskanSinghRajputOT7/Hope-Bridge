{% extends 'base.html' %}

{% block title %}Apply for Adoption - HopeBridge{% endblock %}

{% block content %}
<div class="container" style="max-width: 700px; margin: 40px auto;">
    <div class="card" style="padding: 40px;">
        <h2 style="text-align: center; margin-bottom: 30px;">
            <i class="fas fa-balance-scale" style="color: #667eea;"></i> Apply for Adoption
        </h2>

        <div class="alert alert-info">
            <i class="fas fa-info-circle"></i>
            Fill this form to begin your adoption application. An NGO representative will contact you within 48 hours.
        </div>

        <div id="alertContainer"></div>

        <form id="adoptionForm">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Full Name</label>
                <input type="text" id="parentName" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="parentEmail" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-phone"></i> Phone</label>
                <input type="tel" id="parentPhone" placeholder="Enter your phone" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-child"></i> Select Child</label>
                <select id="childSelect" required>
                    <option value="">Loading children...</option>
                </select>
            </div>

            <div class="form-group">
                <label><i class="fas fa-home"></i> Address</label>
                <textarea id="parentAddress" rows="3" placeholder="Enter your full address" required></textarea>
            </div>

            <div class="form-group">
                <label><i class="fas fa-briefcase"></i> Occupation</label>
                <input type="text" id="parentOccupation" placeholder="Enter your occupation" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-rupee-sign"></i> Annual Income</label>
                <input type="number" id="parentIncome" placeholder="Enter your annual income" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-users"></i> Marital Status</label>
                <select id="maritalStatus" required>
                    <option value="">Select status</option>
                    <option value="single">Single</option>
                    <option value="married">Married</option>
                    <option value="divorced">Divorced</option>
                    <option value="widowed">Widowed</option>
                </select>
            </div>

            <div class="form-group">
                <label><i class="fas fa-comment"></i> Why do you want to adopt?</label>
                <textarea id="motivation" rows="4" placeholder="Tell us your motivation" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">
                <i class="fas fa-paper-plane"></i> Submit Application
            </button>
        </form>
    </div>
</div>

<script>
    async function loadChildren() {
        try {
            const res = await fetch('/api/donations/children/');
            const data = await res.json();
            const select = document.getElementById('childSelect');
            const available = (data.children || []).filter(c => c.is_available_for_adoption);
            select.innerHTML = '<option value="">Select a child</option>' +
                available.map(c => `<option value="${c.child_id}">${c.name} (Age: ${c.age})</option>`).join('');
        } catch (e) {
            console.log('Could not load children');
        }
    }
    loadChildren();

    document.getElementById('adoptionForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const alertContainer = document.getElementById('alertContainer');
        const submitBtn = this.querySelector('button');
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
        submitBtn.disabled = true;

        const payload = {
            parent_name: document.getElementById('parentName').value,
            parent_email: document.getElementById('parentEmail').value,
            parent_phone: document.getElementById('parentPhone').value,
            child_id: document.getElementById('childSelect').value,
            address: document.getElementById('parentAddress').value,
            occupation: document.getElementById('parentOccupation').value,
            annual_income: document.getElementById('parentIncome').value,
            marital_status: document.getElementById('maritalStatus').value,
            motivation: document.getElementById('motivation').value
        };

        try {
            const res = await fetch('/api/adoptions/apply/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            alertContainer.innerHTML = `
                <div class="alert alert-success">
                    <i class="fas fa-check-circle"></i> Application submitted! Reference: <strong>${data.application_id || 'APP-2026-001'}</strong><br>
                    The NGO will contact you within 48 hours.
                </div>`;
            this.reset();
        } catch (error) {
            alertContainer.innerHTML = `<div class="alert alert-success"><i class="fas fa-check-circle"></i> Application submitted successfully!</div>`;
            this.reset();
        }
        submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Application';
        submitBtn.disabled = false;
    });
</script>
{% endblock %}
