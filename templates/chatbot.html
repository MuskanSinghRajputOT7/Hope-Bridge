{% extends 'base.html' %}

{% block title %}AI Chatbot - HopeBridge{% endblock %}

{% block content %}
<div class="container" style="max-width: 800px; margin: 30px auto;">
    <h2 style="text-align: center; margin-bottom: 20px;">
        <i class="fas fa-robot" style="color: #667eea;"></i> HopeBridge Assistant
    </h2>

    <div class="card" style="height: 500px; display: flex; flex-direction: column;">
        <div id="chatMessages" style="flex: 1; overflow-y: auto; padding: 20px; background: #f9f9f9; border-radius: 10px;">
            <div style="margin-bottom: 15px;">
                <div style="background: #667eea; color: white; padding: 12px; border-radius: 10px; max-width: 70%; display: inline-block;">
                    Hello! I'm here to help with adoption, donations, and general questions. How can I assist you today?
                </div>
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <input type="text" id="chatInput" placeholder="Type your question..." style="flex: 1; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px;">
            <button id="sendBtn" class="btn btn-primary" style="padding: 12px 25px;">
                <i class="fas fa-paper-plane"></i> Send
            </button>
        </div>
    </div>

    <div class="card" style="margin-top: 20px;">
        <h3>Quick Questions:</h3>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
            <button class="btn btn-outline quick-btn">How do I sponsor a child?</button>
            <button class="btn btn-outline quick-btn">What is the adoption process?</button>
            <button class="btn btn-outline quick-btn">What documents do I need?</button>
            <button class="btn btn-outline quick-btn">How can I volunteer?</button>
        </div>
    </div>
</div>

<script>
    const messages = document.getElementById('chatMessages');
    const input = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    function addMessage(text, isUser = false) {
        const div = document.createElement('div');
        div.style.marginBottom = '15px';
        div.style.textAlign = isUser ? 'right' : 'left';
        div.innerHTML = `
            <div style="background: ${isUser ? '#764ba2' : '#667eea'}; color: white; padding: 12px; border-radius: 10px; max-width: 70%; display: inline-block; text-align: left;">
                ${text}
            </div>`;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        addMessage(text, true);
        input.value = '';

        const loadingDiv = document.createElement('div');
        loadingDiv.style.marginBottom = '15px';
        loadingDiv.innerHTML = '<div style="background: #667eea; color: white; padding: 12px; border-radius: 10px; max-width: 70%; display: inline-block;">Thinking...</div>';
        messages.appendChild(loadingDiv);
        messages.scrollTop = messages.scrollHeight;

        try {
            const res = await fetch('/api/analytics/chatbot/ask/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: text })
            });
            const data = await res.json();
            loadingDiv.remove();
            addMessage(data.response || 'I can help with that! Please contact our support team.');
        } catch (error) {
            loadingDiv.remove();
            addMessage('I can help you with adoption, donations, and volunteering. Please try again or contact support.');
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

    document.querySelectorAll('.quick-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            input.value = btn.textContent;
            sendMessage();
        });
    });
</script>
{% endblock %}
